plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mentora.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mentora.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

kotlin {
    jvmToolchain(17)
}
